name: CD

on:
  # main -> production VM (duchanhpremium.vn), develop -> staging VM
  # (bluedental.bluestar.com.vn). Which VM is decided by the GitHub
  # environment below: each environment carries its own SSH_* secrets and
  # SITE_URL variable.
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Deploy without re-running CI (hotfix only)'
        type: boolean
        default: false

# Never let two deploys touch the VM at once; queue instead of cancelling so a
# half-applied deploy is not abandoned mid-flight.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  # develop only: build both images here and push them to GHCR, so the staging
  # VM just pulls. That VM is shared with ~10 other apps, has 11 GB RAM and no
  # swap; `dotnet publish` inside `docker compose build` took 3.5 GB there and
  # froze the whole machine twice on 2026-11-11. main is untouched: production
  # still builds on its own VM (deploy.sh without API_IMAGE).
  images:
    name: Build and push images
    needs: [ci]
    if: ${{ always() && github.ref_name == 'develop' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.names.outputs.api }}
      frontend: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR wants lowercase
          echo "api=ghcr.io/$owner/bluedental-api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/bluedental-frontend:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same cache scopes as the "Docker images build" job in ci.yml, which
      # has just built these exact contexts, so this is mostly a cache hit.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: BlueDental.BE
          push: true
          tags: ${{ steps.names.outputs.api }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: BlueDental.FE
          push: true
          tags: ${{ steps.names.outputs.frontend }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VM
    needs: [ci, images]
    # `always()` so a skip_ci dispatch (which skips the ci job) still deploys,
    # while a genuine CI failure still blocks.
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read   # the VM pulls the images with this job's token

    steps:
      # Without this the run dies inside ssh with "no argument after keyword
      # hostname", which says nothing about the actual cause.
      - name: Check deploy secrets are set
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} -- see docs/cicd-setup.md step 3."
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          # Pinned host key: without this, StrictHostKeyChecking would have to
          # be off, which would accept any MITM host key.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
          chmod 600 ~/.ssh/config

      # The GHCR packages are private. Log the VM in with this job's token,
      # into a throwaway docker config (not ~/.docker, which other apps on the
      # VM use). The token goes over stdin, never argv, and dies with the job.
      - name: Log the VM in to GHCR
        if: ${{ needs.images.result == 'success' }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh deploy-target \
            "umask 077; mkdir -p ~/.cache/bluedental-ghcr && docker --config ~/.cache/bluedental-ghcr login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/hung/BlueDental' }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          # Empty on main (images job skipped) -> deploy.sh builds on the VM.
          API_IMAGE: ${{ needs.images.outputs.api }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
        run: |
          ssh deploy-target \
            DEPLOY_PATH="$DEPLOY_PATH" DEPLOY_SHA="$DEPLOY_SHA" DEPLOY_BRANCH="$DEPLOY_BRANCH" \
            API_IMAGE="$API_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          echo "==> currently deployed: $(git rev-parse HEAD)"
          echo "==> deploying:          $DEPLOY_SHA ($DEPLOY_BRANCH)"

          git fetch --prune origin
          # Hard reset to the exact commit CI validated. Untracked+ignored files
          # (.env, Logs/) are left alone by reset, so server config survives.
          git checkout -f -B "$DEPLOY_BRANCH" "$DEPLOY_SHA"

          bash deploy.sh
          REMOTE

      - name: Log the VM out of GHCR
        if: ${{ always() && needs.images.result == 'success' }}
        run: ssh deploy-target 'rm -rf "$HOME/.cache/bluedental-ghcr"'

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://duchanhpremium.vn' }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo 000)
            printf '%-50s -> %s\n' "$1" "$code"
            [[ "$code" == "$2" ]] || fail=1
          }
          check "$SITE_URL/"       200
          check "$SITE_URL/health" 200
          exit $fail

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy failed. SSH to the VM and check: docker compose ps && docker compose logs --tail=100 api"
