name: bluedental

x-backend-environment: &backend-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-BlueDental};Username=${POSTGRES_USER:-bluedental};Password=${POSTGRES_PASSWORD:-bluedental}
  App__CorsOrigins: ${FRONTEND_URL:-http://localhost:8080}
  App__KnownProxies__0: 172.29.0.10
  Redis__IsEnabled: "true"
  Redis__Configuration: redis:6379,password=${REDIS_PASSWORD:-redis}
  BlobStorage__Endpoint: minio:9000
  BlobStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
  BlobStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
  BlobStorage__BucketName: bluedental-files
  BlobStorage__WithSsl: "false"
  MalwareScan__Host: clamav
  MalwareScan__Port: "3310"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-BlueDental}
      POSTGRES_USER: ${POSTGRES_USER:-bluedental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluedental}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bluedental} -d ${POSTGRES_DB:-BlueDental}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      bluedental:
        ipv4_address: 172.29.0.30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-redis}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      bluedental:
        ipv4_address: 172.29.0.40

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      bluedental:
        ipv4_address: 172.29.0.50

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks:
      bluedental:
        ipv4_address: 172.29.0.70

